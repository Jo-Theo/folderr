name: R-CMD-check

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            roxygen2
            rcmdcheck
          needs: check

      # Generate documentation
      - name: Run roxygen2
        run: |
          roxygen2::roxygenise()
        shell: Rscript {0}

      # Fail if roxygen changed files but they weren't committed
      - name: Check for uncommitted roxygen changes
        run: |
          git diff --exit-code
        shell: bash

      # R CMD check
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          error-on: '"error"'